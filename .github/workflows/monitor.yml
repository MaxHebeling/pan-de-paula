# Monitor de disponibilidad de la tienda y el CRM.
#
# Cada 5 minutos sondea las rutas críticas (docs/MONITORING.md §1). Avisa UNA vez cuando algo se cae
# y UNA vez cuando vuelve: el aviso se lleva en un issue con la etiqueta `uptime`, que hace de
# memoria entre corridas — sin él, una caída de dos horas mandaría 24 correos iguales.
#
# Tres avisos, por si uno falla: correo por Resend, el issue, y el propio correo de GitHub al fallar
# el job. Los secretos (RESEND_API_KEY, EMAIL_FROM, ALERT_EMAIL_TO) viven en Actions, no en el repo;
# este workflow no corre nunca desde un pull request, así que un fork no puede leerlos.
name: Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  disponibilidad:
    name: ¿Responden la tienda y el CRM?
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Sondear
        id: sonda
        continue-on-error: true
        run: bash scripts/monitor-check.sh
        env:
          WEB_URL: https://www.pandepaula.com
          ADMIN_URL: https://crm.pandepaula.com

      - name: Avisar
        env:
          GH_TOKEN: ${{ github.token }}
          ESTADO: ${{ steps.sonda.outputs.estado }}
          DETALLE: ${{ steps.sonda.outputs.detalle }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          # Sin salida de la sonda no se sabe nada: se trata como caída, que es el lado seguro.
          [ -z "${ESTADO:-}" ] && ESTADO=caido && DETALLE="La sonda no pudo ejecutarse. Ver la corrida."

          # Un solo correo por episodio, no uno cada 5 minutos.
          correo() {
            local asunto="$1" cuerpo="$2"
            if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${EMAIL_FROM:-}" ] || [ -z "${ALERT_EMAIL_TO:-}" ]; then
              echo "· Correo no configurado (faltan secretos): el aviso queda en el issue y en GitHub."
              return 0
            fi
            local destinos
            destinos=$(printf '%s' "$ALERT_EMAIL_TO" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep . | jq -R . | jq -sc .)
            jq -nc --arg from "$EMAIL_FROM" --argjson to "$destinos" --arg subject "$asunto" --arg text "$cuerpo" \
              '{from:$from, to:$to, subject:$subject, text:$text}' > /tmp/correo.json
            local codigo
            codigo=$(curl -sS -o /tmp/correo-resp.json -w '%{http_code}' -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
              --data @/tmp/correo.json)
            # El cuerpo de la respuesta no se imprime: los registros de un repo público son visibles.
            [ "$codigo" = "200" ] && echo "· Correo enviado." || echo "· Resend respondió $codigo."
          }

          abierto=$(gh issue list --label uptime --state open --limit 1 --json number -q '.[0].number')

          if [ "$ESTADO" = "caido" ]; then
            echo "$DETALLE"
            if [ -z "$abierto" ]; then
              gh label create uptime --color B60205 --description "Caída detectada por el monitor" 2>/dev/null || true
              cuerpo="El monitor no obtuvo respuesta en dos intentos seguidos:

          $DETALLE

          Qué hacer: docs/INCIDENT_RESPONSE.md · si fue un despliegue, docs/ROLLBACK.md.
          Corrida: $CORRIDA"
              numero=$(gh issue create --label uptime --title "🔴 Caída: la tienda o el CRM no responden" \
                --body "$cuerpo" | grep -oE '[0-9]+$')
              echo "· Issue #$numero abierto."
              correo "🔴 Pan de Paula: algo no responde" "$cuerpo"
            else
              echo "· Ya estaba avisado en el issue #$abierto; no se repite el aviso."
            fi
            exit 1
          fi

          if [ -n "$abierto" ]; then
            gh issue close "$abierto" --comment "✅ Todo volvió a responder. Corrida: $CORRIDA"
            correo "✅ Pan de Paula: todo volvió a responder" "La tienda y el CRM responden con normalidad.

          Corrida: $CORRIDA"
            echo "· Restablecido; issue #$abierto cerrado."
          fi
