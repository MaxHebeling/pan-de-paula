name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/pan_de_paula
  DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/pan_de_paula_test
  DATABASE_SSL: disable
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
  META_VERIFY_TOKEN: ci-verify
  # ≥ 16 caracteres: isCronAuthorized rechaza secretos más cortos (los crons responderían 401 siempre)
  CRON_SECRET: ci-cron-secret-0123456789abcdef
  APP_ENV: development

jobs:
  quality:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile
      - name: Verificar secretos en el repo
        run: pnpm check:secrets
      - name: Verificar migraciones (inmutables y ordenadas)
        run: pnpm check:migrations
      - name: Crear bases
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'create database pan_de_paula'
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'create database pan_de_paula_test'
      - name: Migrar + generar tipos + seed
        run: |
          pnpm db:migrate
          pnpm db:codegen
          pnpm db:seed
      - name: Tipos de base versionados al día (los builds de Vercel parten de un checkout limpio)
        run: |
          if ! git diff --exit-code -- packages/db/src/generated; then
            echo "::error::packages/db/src/generated/db.ts no coincide con las migraciones. Corre 'pnpm db:migrate && pnpm db:codegen' y commitea el resultado."
            exit 1
          fi
      - name: Verificar privilegios (anon/authenticated sin acceso a tablas, vistas, secuencias ni funciones)
        run: bash scripts/check-grants.sh "$DATABASE_URL"
      - name: Variables de entorno de CI coherentes
        run: node scripts/check-env.mjs development
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (unit + integración DB)
        run: pnpm test
      - name: Auditoría de dependencias (alta severidad)
        run: pnpm audit --audit-level high --prod || (echo '::warning::Vulnerabilidades en dependencias' && exit 1)
      # Sin claves VAPID el E2E de avisos se salta ENTERO ("no hay nada que ofrecer"), así que en CI
      # nunca se comprobaba que el portal pide permiso explicando antes, que "Ahora no" se recuerda, ni
      # que la suscripción queda en la cuenta correcta. Se generan efímeras: no son secretos de nadie.
      # Va antes del build porque NEXT_PUBLIC_VAPID_PUBLIC_KEY se hornea en el bundle del navegador.
      - name: Claves VAPID efímeras para el E2E de avisos
        run: |
          pnpm --filter @pdp/integrations exec node -e "
            const { generateVAPIDKeys } = require('web-push');
            const k = generateVAPIDKeys();
            console.log('VAPID_PUBLIC_KEY=' + k.publicKey);
            console.log('NEXT_PUBLIC_VAPID_PUBLIC_KEY=' + k.publicKey);
            console.log('VAPID_PRIVATE_KEY=' + k.privateKey);
            console.log('VAPID_SUBJECT=mailto:ci@pandepaula.invalid');
          " >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build
      # Va justo después del build porque revisa el RESULTADO: en Next basta importar un módulo de
      # servidor desde un componente cliente para que su valor quede horneado en un chunk, y eso no se
      # ve leyendo el código. Aquí no hay secretos reales, así que solo aplica la detección por forma
      # de credencial; el cotejo contra los valores de verdad corre en la máquina del operador.
      - name: Secretos en el bundle del navegador
        run: bash scripts/check-client-bundle.sh
      # Tope propio del paso. El E2E tarda ~5 min con sus 103 pruebas; 12 dejan margen de sobra.
      # Existe porque en el PR #43 las 103 pruebas PASARON en 4,8 min y después el paso se quedó
      # colgado 16 minutos sin salir —el `pnpm start` del webServer no termina de morir—, hasta que el
      # job se cortó a los 25. El resultado se reportaba como "el job excedió el tiempo máximo", que no
      # dice nada: parecía una CI lenta y era un proceso que no cierra. Con el tope aquí, un cuelgue
      # falla en 12 minutos y señala al paso culpable.
      - name: E2E (Playwright)
        timeout-minutes: 12
        run: |
          pnpm --filter @pdp/web exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Subir reporte E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report
            apps/*/test-results
          retention-days: 7
