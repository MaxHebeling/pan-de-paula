name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/pan_de_paula
  DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/pan_de_paula_test
  DATABASE_SSL: disable
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
  META_VERIFY_TOKEN: ci-verify
  # ≥ 16 caracteres: isCronAuthorized rechaza secretos más cortos (los crons responderían 401 siempre)
  CRON_SECRET: ci-cron-secret-0123456789abcdef
  APP_ENV: development

jobs:
  quality:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile
      - name: Verificar secretos en el repo
        run: pnpm check:secrets
      - name: Verificar migraciones (inmutables y ordenadas)
        run: pnpm check:migrations
      - name: Crear bases
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'create database pan_de_paula'
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'create database pan_de_paula_test'
      - name: Migrar + generar tipos + seed
        run: |
          pnpm db:migrate
          pnpm db:codegen
          pnpm db:seed
      - name: Verificar privilegios (anon/authenticated sin acceso a tablas, vistas, secuencias ni funciones)
        run: bash scripts/check-grants.sh "$DATABASE_URL"
      - name: Variables de entorno de CI coherentes
        run: node scripts/check-env.mjs development
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (unit + integración DB)
        run: pnpm test
      - name: Auditoría de dependencias (alta severidad)
        run: pnpm audit --audit-level high --prod || (echo '::warning::Vulnerabilidades en dependencias' && exit 1)
      - name: Build
        run: pnpm build
      - name: E2E (Playwright)
        run: |
          pnpm --filter @pdp/web exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Subir reporte E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report
            apps/*/test-results
          retention-days: 7
